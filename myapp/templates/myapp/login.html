{% extends 'myapp/base.html' %}
{% load static %}

{% block content %}
<section class="auth-section">
    <h2>Login to PizzaHub</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</section>
{% endblock %}
