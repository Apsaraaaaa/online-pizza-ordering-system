{% extends 'myapp/base.html' %}

{% block content %}
<h2>Our Pizzas</h2>
<div class="pizza-list">
    {% for pizza in pizzas %}
    <div class="pizza-card">
        <img src="{{ pizza.image.url }}" alt="{{ pizza.name }}">
        <h3>{{ pizza.name }}</h3>
        <p>Size: {{ pizza.size }}</p>
        <p>Crust: {{ pizza.crust }}</p>
        <p>Price: ${{ pizza.price }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
