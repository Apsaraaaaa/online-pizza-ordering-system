{% extends "myapp/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'myapp/css/admin.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit Pizza: {{ pizza.name }}</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Pizza Name</label>
            <input type="text" name="name" id="name" value="{{ pizza.name }}" required>
        </div>

        <div class="form-group">
            <label for="size">Size</label>
            <select name="size" id="size" required>
                {% for s in sizes %}
                    <option value="{{ s.id }}" {% if pizza.size.id == s.id %}selected{% endif %}>{{ s.name }} - ${{ s.price }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="crust">Crust</label>
            <select name="crust" id="crust" required>
                {% for c in crusts %}
                    <option value="{{ c.id }}" {% if pizza.crust.id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Toppings</label><br>
            {% for t in toppings %}
                <input type="checkbox" name="toppings" value="{{ t.id }}" 
                {% if t in pizza.toppings.all %}checked{% endif %}> {{ t.name }} (${{ t.extra_price }})<br>
            {% endfor %}
        </div>

        <button type="submit">Update Pizza</button>
    </form>
</div>
{% endblock %}
